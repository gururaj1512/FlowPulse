table:
  name: workflow_runs
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: triggered_by_user
    using:
      foreign_key_constraint_on: triggered_by
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: step_runs
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
      set:
        triggered_by: x-hasura-User-Id
      columns:
        - workflow_id
        - org_id
        - status
        - trigger_type
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - org_id
        - status
        - triggered_by
        - trigger_type
        - started_at
        - completed_at
        - created_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
      allow_aggregations: true
